name: Engine checks

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 1e208b280deb18f01d015b0acdf3ef3552d08039
          path: .hermes-audit
          sparse-checkout: |
            skills
            optional-skills
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - run: uv sync --locked
      - name: Verify pinned Hermes skill imports
        run: uv run python scripts/audit_skill_import_compatibility.py --check
      - run: uv run ruff check engine scripts tests
      - run: uv run ruff format --check engine scripts tests
      - run: uv run pyright engine scripts
      - run: uv run python scripts/export_api_contract.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run contracts:check
      - run: npm run typecheck
      - run: npm run test:client
      - name: Verify explicit specialist conflict choices in the desktop UI
        run: npm run test:browser -- tests/browser/task-review.spec.ts
        timeout-minutes: 3
      - run: uv run pytest -q
      - name: Verify specialist recovery after API process death
        run: uv run python scripts/specialist_restart_diagnostic.py
        timeout-minutes: 2
      - name: Verify Telegram delivery recovery after worker process death
        run: uv run python scripts/telegram_crash_diagnostic.py
        timeout-minutes: 2
      - name: Verify scheduled Telegram outbox recovery after worker process death
        run: uv run python scripts/telegram_crash_diagnostic.py --scheduled
        timeout-minutes: 2

  windows-installer:
    needs: windows
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: rustup override set 1.99.1
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-xaa-rust-1.99.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - run: npm run build:installer
      - name: Verify recovery after native Tauri desktop process death
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $debugPort = 19224
          $env:XAA_NATIVE_DEBUG_PORT = [string]$debugPort
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $elevated = ([Security.Principal.WindowsPrincipal]::new($identity)).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $policyPath = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          $policyCreated = $false
          $valueCreated = $false
          try {
            if ($elevated) {
              $existing = Get-Item -LiteralPath $policyPath -ErrorAction SilentlyContinue
              if ($existing -and $existing.GetValueNames() -contains 'xaa-desktop.exe') { throw 'Refusing to replace existing app debugging configuration.' }
              if (-not $existing) { New-Item -Path $policyPath -Force | Out-Null; $policyCreated = $true }
              New-ItemProperty -LiteralPath $policyPath -Name 'xaa-desktop.exe' -Value "--remote-debugging-port=$debugPort" -PropertyType String | Out-Null
              $valueCreated = $true
            }
            node scripts/native_restart_smoke.mjs build/native-release/xaa-desktop.exe
            if ($LASTEXITCODE -ne 0) { throw "Native restart acceptance exited with code $LASTEXITCODE." }
          } finally {
            if ($valueCreated) { Remove-ItemProperty -LiteralPath $policyPath -Name 'xaa-desktop.exe' }
            if ($policyCreated -and (Test-Path -LiteralPath $policyPath)) {
              $remainingValues = (Get-Item -LiteralPath $policyPath).GetValueNames()
              if ($remainingValues.Count -eq 0) { Remove-Item -LiteralPath $policyPath }
            }
            Remove-Item Env:XAA_NATIVE_DEBUG_PORT -ErrorAction SilentlyContinue
          }
        timeout-minutes: 5
      - name: Verify preference and sourced-knowledge controls in native Tauri desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $debugPort = 19226
          $env:XAA_NATIVE_DEBUG_PORT = [string]$debugPort
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $elevated = ([Security.Principal.WindowsPrincipal]::new($identity)).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $policyPath = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          $policyCreated = $false
          $valueCreated = $false
          try {
            if ($elevated) {
              $existing = Get-Item -LiteralPath $policyPath -ErrorAction SilentlyContinue
              if ($existing -and $existing.GetValueNames() -contains 'xaa-desktop.exe') { throw 'Refusing to replace existing app debugging configuration.' }
              if (-not $existing) { New-Item -Path $policyPath -Force | Out-Null; $policyCreated = $true }
              New-ItemProperty -LiteralPath $policyPath -Name 'xaa-desktop.exe' -Value "--remote-debugging-port=$debugPort" -PropertyType String | Out-Null
              $valueCreated = $true
            }
            node scripts/native_memory_smoke.mjs build/native-release/xaa-desktop.exe
            if ($LASTEXITCODE -ne 0) { throw "Native memory acceptance exited with code $LASTEXITCODE." }
          } finally {
            if ($valueCreated) { Remove-ItemProperty -LiteralPath $policyPath -Name 'xaa-desktop.exe' }
            if ($policyCreated -and (Test-Path -LiteralPath $policyPath)) {
              $remainingValues = (Get-Item -LiteralPath $policyPath).GetValueNames()
              if ($remainingValues.Count -eq 0) { Remove-Item -LiteralPath $policyPath }
            }
            Remove-Item Env:XAA_NATIVE_DEBUG_PORT -ErrorAction SilentlyContinue
          }
        timeout-minutes: 5
      - name: Verify named specialist recovery after native Tauri desktop process death
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $debugPort = 19225
          $env:XAA_NATIVE_DEBUG_PORT = [string]$debugPort
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $elevated = ([Security.Principal.WindowsPrincipal]::new($identity)).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $policyPath = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          $policyCreated = $false
          $valueCreated = $false
          try {
            if ($elevated) {
              $existing = Get-Item -LiteralPath $policyPath -ErrorAction SilentlyContinue
              if ($existing -and $existing.GetValueNames() -contains 'xaa-desktop.exe') { throw 'Refusing to replace existing app debugging configuration.' }
              if (-not $existing) { New-Item -Path $policyPath -Force | Out-Null; $policyCreated = $true }
              New-ItemProperty -LiteralPath $policyPath -Name 'xaa-desktop.exe' -Value "--remote-debugging-port=$debugPort" -PropertyType String | Out-Null
              $valueCreated = $true
            }
            node scripts/native_restart_smoke.mjs build/native-release/xaa-desktop.exe --specialist
            if ($LASTEXITCODE -ne 0) { throw "Native specialist restart acceptance exited with code $LASTEXITCODE." }
          } finally {
            if ($valueCreated) { Remove-ItemProperty -LiteralPath $policyPath -Name 'xaa-desktop.exe' }
            if ($policyCreated -and (Test-Path -LiteralPath $policyPath)) {
              $remainingValues = (Get-Item -LiteralPath $policyPath).GetValueNames()
              if ($remainingValues.Count -eq 0) { Remove-Item -LiteralPath $policyPath }
            }
            Remove-Item Env:XAA_NATIVE_DEBUG_PORT -ErrorAction SilentlyContinue
          }
        timeout-minutes: 5
      - name: Verify frozen specialist recovery after API process death
        run: uv run python scripts/frozen_specialist_restart_diagnostic.py
        env:
          XAA_FROZEN_API_EXECUTABLE: build/native-release/xaa-engine.exe
        timeout-minutes: 3
      - name: Verify frozen ACP entry point and packaged version metadata
        run: uv run python scripts/frozen_acp_diagnostic.py --engine apps/desktop/src-tauri/binaries/xaa-engine-x86_64-pc-windows-msvc.exe
        timeout-minutes: 2
      - name: Verify frozen snapshot worker and packaged execution resources
        run: uv run python scripts/frozen_command_diagnostic.py --snapshot-only
        timeout-minutes: 2
      - name: Verify task-scoped frozen filesystem workers
        run: uv run python scripts/task_worker_scope_diagnostic.py
        timeout-minutes: 2
      - name: Verify private task command snapshot scopes
        run: uv run python scripts/task_command_snapshot_diagnostic.py --engine apps/desktop/src-tauri/binaries/xaa-engine-x86_64-pc-windows-msvc.exe
        timeout-minutes: 2
      - name: Download previous 0.1.0 installer for upgrade acceptance
        run: gh run download 42181905058 --repo $env:GITHUB_REPOSITORY --name xaa-windows-installer-unsigned --dir build/prior-installer
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install, boot and uninstall unsigned package
        run: ./scripts/installer_ci_smoke.ps1
        timeout-minutes: 5
      - uses: actions/cache/save@v4
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-xaa-rust-1.99.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xaa-windows-installer-unsigned
          path: |
            build/installer/*
            .acceptance/**/report.json
            .acceptance/**/desktop-stdout.log
            .acceptance/**/desktop-stderr.log
            .acceptance/**/engine-startup.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
