name: Engine checks

on:
  push:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/releases/THIRD_PARTY_NOTICES.md'
      - 'docs/releases/dependency-inventory.md'
      - 'docs/releases/0.1.1.md'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/releases/THIRD_PARTY_NOTICES.md'
      - 'docs/releases/dependency-inventory.md'
      - 'docs/releases/0.1.1.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    env:
      UV_CACHE_DIR: .uv-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-uv.txt
      - uses: actions/cache/restore@v6
        id: uv-cache
        with:
          path: .uv-cache
          key: ${{ runner.os }}-windows-source-xaa-uv-${{ hashFiles('uv.lock') }}
      - name: Install pinned uv from its verified PyPI wheel
        run: python -m pip install --disable-pip-version-check --no-deps --require-hashes -r .github/requirements-uv.txt
      - uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: 1e208b280deb18f01d015b0acdf3ef3552d08039
          path: .hermes-audit
          sparse-checkout: |
            skills
            optional-skills
            agent
            gateway
            plugin-catalog
            plugins/platforms
            tools
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - run: uv sync --locked
      - name: Verify managed-browser popup cleanup in Microsoft Edge
        run: uv run python scripts/browser_popup_smoke.py
        timeout-minutes: 2
      - uses: actions/upload-artifact@v4
        with:
          name: browser-popup-edge-${{ github.run_id }}
          path: .acceptance/browser-popup-edge-*/report.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Verify approved and blocked redirects in Microsoft Edge
        run: uv run python scripts/browser_redirect_smoke.py
        timeout-minutes: 2
      - uses: actions/upload-artifact@v4
        with:
          name: browser-redirect-edge-${{ github.run_id }}
          path: .acceptance/browser-redirect-edge-*/report.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Verify cancellation and timeout of live Microsoft Edge navigation
        run: uv run python scripts/browser_cancel_smoke.py
        timeout-minutes: 2
      - uses: actions/upload-artifact@v4
        with:
          name: browser-cancel-edge-${{ github.run_id }}
          path: .acceptance/browser-cancel-edge-*/report.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Verify authenticated API cancellation of managed browser worker
        run: uv run python scripts/browser_api_cancel_smoke.py
        timeout-minutes: 2
      - uses: actions/upload-artifact@v4
        with:
          name: browser-api-cancel-${{ github.run_id }}
          path: .acceptance/browser-api-cancel-${{ github.run_id }}/report.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Verify Microsoft Edge cannot bypass the browser proxy to loopback
        run: uv run python scripts/browser_proxy_bypass_smoke.py
        timeout-minutes: 2
      - uses: actions/upload-artifact@v4
        with:
          name: browser-proxy-bypass-${{ github.run_id }}
          path: .acceptance/browser-proxy-bypass-*/report.json
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/cache/save@v6
        if: success() && steps.uv-cache.outputs.cache-hit != 'true'
        with:
          path: .uv-cache
          key: ${{ runner.os }}-windows-source-xaa-uv-${{ hashFiles('uv.lock') }}
      - name: Verify pinned Hermes skill imports
        run: uv run python scripts/audit_skill_import_compatibility.py --check
      - name: Verify pinned Hermes channel inventory
        run: uv run python scripts/audit_channel_inventory.py --check
      - name: Verify pinned Hermes execution inventory
        run: uv run python scripts/audit_execution_inventory.py --check
      - run: uv run ruff check engine scripts tests
      - run: uv run ruff format --check engine scripts tests
      - run: uv run pyright engine scripts
      - run: uv run python scripts/export_api_contract.py --check
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run contracts:check
      - run: npm run typecheck
      - run: npm run test:client
      - name: Verify explicit specialist conflict choices in the desktop UI
        run: npm run test:browser -- tests/browser/task-review.spec.ts tests/browser/voice-input.spec.ts tests/browser/onboarding.spec.ts
        timeout-minutes: 3
      - name: Verify desktop startup restores unfinished owner recovery
        run: npm run test:browser -- tests/browser/startup-recovery.spec.ts
        timeout-minutes: 3
      - run: uv run pytest -q
      - name: Verify specialist recovery after API process death
        run: uv run python scripts/specialist_restart_diagnostic.py
        timeout-minutes: 2
      - name: Verify Telegram delivery recovery after worker process death
        run: uv run python scripts/telegram_crash_diagnostic.py
        timeout-minutes: 2
      - name: Verify scheduled Telegram outbox recovery after worker process death
        run: uv run python scripts/telegram_crash_diagnostic.py --scheduled
        timeout-minutes: 2

  windows-installer:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: .uv-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-uv.txt
      - uses: actions/cache/restore@v6
        id: uv-cache
        with:
          path: .uv-cache
          key: ${{ runner.os }}-windows-installer-xaa-uv-${{ hashFiles('uv.lock') }}
      - name: Install pinned uv from its verified PyPI wheel
        run: python -m pip install --disable-pip-version-check --no-deps --require-hashes -r .github/requirements-uv.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: uv sync --locked
      - uses: actions/cache/save@v6
        if: success() && steps.uv-cache.outputs.cache-hit != 'true'
        with:
          path: .uv-cache
          key: ${{ runner.os }}-windows-installer-xaa-uv-${{ hashFiles('uv.lock') }}
      - run: npm ci
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: rustup override set 1.99.1
      - uses: actions/cache/restore@v6
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-xaa-rust-1.99.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - uses: actions/cache/restore@v6
        id: nsis-cache
        with:
          path: ~/AppData/Local/tauri/NSIS
          key: ${{ runner.os }}-xaa-nsis-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - name: Prepare verified Tauri NSIS tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsisPath = Join-Path $env:LOCALAPPDATA 'tauri\NSIS'
          $utilityPath = Join-Path $nsisPath 'Plugins\x86-unicode\additional\nsis_tauri_utils.dll'
          $requiredFiles = @('NSIS.exe', 'makensis.exe', 'Bin/makensis.exe', 'Stubs/lzma-x86-unicode', 'Stubs/lzma_solid-x86-unicode', 'Plugins/x86-unicode/additional/nsis_tauri_utils.dll', 'Include/MUI2.nsh', 'Include/FileFunc.nsh', 'Include/x64.nsh', 'Include/nsDialogs.nsh', 'Include/WinMessages.nsh', 'Include/Win/COM.nsh', 'Include/Win/Propkey.nsh', 'Include/Win/RestartManager.nsh')
          $missingFiles = @($requiredFiles | Where-Object { -not (Test-Path -LiteralPath (Join-Path $nsisPath $_)) })
          $nsisHash = '6D45D4E8CCF18FE1FDAC9164058F356102A2ECF2'
          $utilityHash = '75197FEE3C6A814FE035788D1C34EAD39349B860'
          $nsisValid = ($missingFiles.Count -eq 0) -and
            (Get-FileHash -LiteralPath (Join-Path $nsisPath 'NSIS.exe') -Algorithm SHA1).Hash -eq $nsisHash -and
            (Get-FileHash -LiteralPath $utilityPath -Algorithm SHA1).Hash -eq $utilityHash
          if (-not $nsisValid) {
            $archive = '.github/vendor/nsis-3.13-tools.zip'
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne 'FCF5B13FD91D2D40BC425352277504DBE2E8BE43543474912C7BAD69DACE4B03') { throw 'Vendored Tauri NSIS cache SHA-256 mismatch.' }
            if (Test-Path -LiteralPath $nsisPath) { Remove-Item -LiteralPath $nsisPath -Recurse -Force }
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $nsisPath) | Out-Null
            Expand-Archive -LiteralPath $archive -DestinationPath $nsisPath
          }
          $missingFiles = @($requiredFiles | Where-Object { -not (Test-Path -LiteralPath (Join-Path $nsisPath $_)) })
          if ($missingFiles.Count -gt 0) { throw "Tauri NSIS cache is missing required files: $($missingFiles -join ', ')" }
          if ((Get-FileHash -LiteralPath (Join-Path $nsisPath 'NSIS.exe') -Algorithm SHA1).Hash -ne $nsisHash) { throw 'Tauri NSIS executable SHA-1 mismatch.' }
          if ((Get-FileHash -LiteralPath $utilityPath -Algorithm SHA1).Hash -ne $utilityHash) { throw 'Tauri NSIS utility DLL SHA-1 mismatch.' }
      - uses: actions/cache/save@v6
        if: success() && steps.nsis-cache.outputs.cache-hit != 'true'
        with:
          path: ~/AppData/Local/tauri/NSIS
          key: ${{ runner.os }}-xaa-nsis-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - run: npm run build:installer
      - name: Verify recovery after native Tauri desktop process death
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $debugPort = 19224
          $env:XAA_NATIVE_DEBUG_PORT = [string]$debugPort
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $elevated = ([Security.Principal.WindowsPrincipal]::new($identity)).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $policyPath = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          $policyCreated = $false
          $valueCreated = $false
          try {
            if ($elevated) {
              $existing = Get-Item -LiteralPath $policyPath -ErrorAction SilentlyContinue
              if ($existing -and $existing.GetValueNames() -contains 'xaa-desktop.exe') { throw 'Refusing to replace existing app debugging configuration.' }
              if (-not $existing) { New-Item -Path $policyPath -Force | Out-Null; $policyCreated = $true }
              New-ItemProperty -LiteralPath $policyPath -Name 'xaa-desktop.exe' -Value "--remote-debugging-port=$debugPort" -PropertyType String | Out-Null
              $valueCreated = $true
            }
            node scripts/native_restart_smoke.mjs build/native-release/xaa-desktop.exe
            if ($LASTEXITCODE -ne 0) { throw "Native restart acceptance exited with code $LASTEXITCODE." }
          } finally {
            if ($valueCreated) { Remove-ItemProperty -LiteralPath $policyPath -Name 'xaa-desktop.exe' }
            if ($policyCreated -and (Test-Path -LiteralPath $policyPath)) {
              $remainingValues = (Get-Item -LiteralPath $policyPath).GetValueNames()
              if ($remainingValues.Count -eq 0) { Remove-Item -LiteralPath $policyPath }
            }
            Remove-Item Env:XAA_NATIVE_DEBUG_PORT -ErrorAction SilentlyContinue
          }
        timeout-minutes: 5
      - name: Verify preference and sourced-knowledge controls in native Tauri desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $debugPort = 19226
          $env:XAA_NATIVE_DEBUG_PORT = [string]$debugPort
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $elevated = ([Security.Principal.WindowsPrincipal]::new($identity)).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $policyPath = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          $policyCreated = $false
          $valueCreated = $false
          try {
            if ($elevated) {
              $existing = Get-Item -LiteralPath $policyPath -ErrorAction SilentlyContinue
              if ($existing -and $existing.GetValueNames() -contains 'xaa-desktop.exe') { throw 'Refusing to replace existing app debugging configuration.' }
              if (-not $existing) { New-Item -Path $policyPath -Force | Out-Null; $policyCreated = $true }
              New-ItemProperty -LiteralPath $policyPath -Name 'xaa-desktop.exe' -Value "--remote-debugging-port=$debugPort" -PropertyType String | Out-Null
              $valueCreated = $true
            }
            node scripts/native_memory_smoke.mjs build/native-release/xaa-desktop.exe
            if ($LASTEXITCODE -ne 0) { throw "Native memory acceptance exited with code $LASTEXITCODE." }
          } finally {
            if ($valueCreated) { Remove-ItemProperty -LiteralPath $policyPath -Name 'xaa-desktop.exe' }
            if ($policyCreated -and (Test-Path -LiteralPath $policyPath)) {
              $remainingValues = (Get-Item -LiteralPath $policyPath).GetValueNames()
              if ($remainingValues.Count -eq 0) { Remove-Item -LiteralPath $policyPath }
            }
            Remove-Item Env:XAA_NATIVE_DEBUG_PORT -ErrorAction SilentlyContinue
          }
        timeout-minutes: 5
      - name: Verify named specialist recovery after native Tauri desktop process death
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $debugPort = 19225
          $env:XAA_NATIVE_DEBUG_PORT = [string]$debugPort
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $elevated = ([Security.Principal.WindowsPrincipal]::new($identity)).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $policyPath = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          $policyCreated = $false
          $valueCreated = $false
          try {
            if ($elevated) {
              $existing = Get-Item -LiteralPath $policyPath -ErrorAction SilentlyContinue
              if ($existing -and $existing.GetValueNames() -contains 'xaa-desktop.exe') { throw 'Refusing to replace existing app debugging configuration.' }
              if (-not $existing) { New-Item -Path $policyPath -Force | Out-Null; $policyCreated = $true }
              New-ItemProperty -LiteralPath $policyPath -Name 'xaa-desktop.exe' -Value "--remote-debugging-port=$debugPort" -PropertyType String | Out-Null
              $valueCreated = $true
            }
            node scripts/native_restart_smoke.mjs build/native-release/xaa-desktop.exe --specialist
            if ($LASTEXITCODE -ne 0) { throw "Native specialist restart acceptance exited with code $LASTEXITCODE." }
          } finally {
            if ($valueCreated) { Remove-ItemProperty -LiteralPath $policyPath -Name 'xaa-desktop.exe' }
            if ($policyCreated -and (Test-Path -LiteralPath $policyPath)) {
              $remainingValues = (Get-Item -LiteralPath $policyPath).GetValueNames()
              if ($remainingValues.Count -eq 0) { Remove-Item -LiteralPath $policyPath }
            }
            Remove-Item Env:XAA_NATIVE_DEBUG_PORT -ErrorAction SilentlyContinue
          }
        timeout-minutes: 5
      - name: Verify frozen specialist recovery after API process death
        run: uv run python scripts/frozen_specialist_restart_diagnostic.py
        env:
          XAA_FROZEN_API_EXECUTABLE: build/native-release/xaa-engine.exe
        timeout-minutes: 3
      - name: Verify owner-reviewed workspace write recovery through the frozen worker
        run: uv run python scripts/write_crash_diagnostic.py
        env:
          XAA_CRASH_OPERATION: create
          XAA_CRASH_BOUNDARY: created
          XAA_CRASH_RECONCILE_WORKER: "1"
          XAA_FROZEN_WORKER: "1"
          XAA_OWNER_RECONCILIATION: "1"
          XAA_FROZEN_ENGINE_EXECUTABLE: build/native-release/xaa-engine.exe
          XAA_FROZEN_ENGINE_MANIFEST: build/native-release/manifest.json
          XAA_ACCEPTANCE_DIR: .acceptance/workspace-write-owner-${{ github.run_id }}
        timeout-minutes: 2
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-write-owner-recovery-${{ github.run_id }}
          path: .acceptance/workspace-write-owner-${{ github.run_id }}/report.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Verify owner-reviewed workspace edit recovery through the frozen worker
        run: uv run python scripts/write_crash_diagnostic.py
        env:
          XAA_CRASH_OPERATION: write
          XAA_CRASH_BOUNDARY: before_execution
          XAA_CRASH_RECONCILE_WORKER: "1"
          XAA_FROZEN_WORKER: "1"
          XAA_OWNER_RECONCILIATION: "1"
          XAA_FROZEN_ENGINE_EXECUTABLE: build/native-release/xaa-engine.exe
          XAA_FROZEN_ENGINE_MANIFEST: build/native-release/manifest.json
          XAA_ACCEPTANCE_DIR: .acceptance/workspace-edit-owner-${{ github.run_id }}
        timeout-minutes: 2
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-edit-owner-recovery-${{ github.run_id }}
          path: .acceptance/workspace-edit-owner-${{ github.run_id }}/report.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Verify owner-reviewed workspace delete recovery through the frozen worker
        run: uv run python scripts/write_crash_diagnostic.py
        env:
          XAA_CRASH_OPERATION: delete
          XAA_CRASH_BOUNDARY: deleted
          XAA_CRASH_RECONCILE_WORKER: "1"
          XAA_FROZEN_WORKER: "1"
          XAA_OWNER_RECONCILIATION: "1"
          XAA_FROZEN_ENGINE_EXECUTABLE: build/native-release/xaa-engine.exe
          XAA_FROZEN_ENGINE_MANIFEST: build/native-release/manifest.json
          XAA_ACCEPTANCE_DIR: .acceptance/workspace-delete-owner-${{ github.run_id }}
        timeout-minutes: 2
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-delete-owner-recovery-${{ github.run_id }}
          path: .acceptance/workspace-delete-owner-${{ github.run_id }}/report.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Verify frozen ACP entry point and packaged version metadata
        run: uv run python scripts/frozen_acp_diagnostic.py --engine apps/desktop/src-tauri/binaries/xaa-engine-x86_64-pc-windows-msvc.exe
        timeout-minutes: 2
      - name: Verify frozen snapshot worker and packaged execution resources
        run: uv run python scripts/frozen_command_diagnostic.py --snapshot-only
        timeout-minutes: 2
      - name: Verify frozen browser read and process-tree cancellation
        run: uv run python scripts/frozen_browser_diagnostic.py
        timeout-minutes: 3
      - uses: actions/upload-artifact@v4
        with:
          name: browser-frozen-edge-${{ github.run_id }}
          path: .acceptance/browser-frozen-cancel-${{ github.run_id }}/report.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Verify task-scoped frozen filesystem workers
        run: uv run python scripts/task_worker_scope_diagnostic.py
        timeout-minutes: 2
      - name: Verify private task command snapshot scopes
        run: uv run python scripts/task_command_snapshot_diagnostic.py --engine apps/desktop/src-tauri/binaries/xaa-engine-x86_64-pc-windows-msvc.exe
        timeout-minutes: 2
      - name: Download previous 0.1.0 installer for upgrade acceptance
        run: gh run download 42181905058 --repo $env:GITHUB_REPOSITORY --name xaa-windows-installer-unsigned --dir build/prior-installer
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install, boot and uninstall unsigned package
        run: ./scripts/installer_ci_smoke.ps1
        timeout-minutes: 5
      - name: Verify explicit application-data removal choice
        run: ./scripts/installer_delete_data_smoke.ps1
        timeout-minutes: 5
      - uses: actions/cache/save@v6
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-xaa-rust-1.99.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xaa-windows-installer-unsigned
          path: |
            build/installer/*
            .acceptance/**/report.json
            .acceptance/**/desktop-stdout.log
            .acceptance/**/desktop-stderr.log
            .acceptance/**/engine-startup.log
            .acceptance/**/failure.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
