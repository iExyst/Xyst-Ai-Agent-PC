name: Engine checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - run: uv sync --locked
      - run: uv run ruff check engine scripts tests
      - run: uv run ruff format --check engine scripts tests
      - run: uv run pyright engine scripts
      - run: uv run python scripts/export_api_contract.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run contracts:check
      - run: npm run typecheck
      - run: npm run test:client
      - run: uv run pytest -q
