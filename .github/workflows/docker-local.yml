name: Docker local acceptance

on:
  push:
    paths:
      - '.github/workflows/docker-local.yml'
      - '.github/workflows/engine.yml'
      - '.github/requirements-uv.txt'
      - 'engine/xaa/runtime/docker_*.py'
      - 'engine/xaa/runtime/command_controller.py'
      - 'engine/xaa/runtime/command_recovery.py'
      - 'engine/xaa/runtime/command_contracts.py'
      - 'engine/xaa/runtime/command_transport.py'
      - 'engine/xaa/storage/docker_sessions.py'
      - 'engine/xaa/storage/commands.py'
      - 'tests/integration/test_docker_local_transport.py'
      - 'tests/unit/test_docker_execution_policy.py'
      - 'tests/unit/test_docker_session_archive.py'
      - 'tests/unit/test_docker_sessions.py'
      - 'tests/unit/test_command_controller.py'
      - 'tests/unit/test_command_grant_api.py'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

concurrency:
  group: docker-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-local-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_CACHE_DIR: .uv-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/requirements-uv.txt
      - uses: actions/cache/restore@v6
        id: uv-cache
        with:
          path: .uv-cache
          key: ${{ runner.os }}-docker-acceptance-xaa-uv-${{ hashFiles('uv.lock') }}
      - name: Install pinned uv from its verified PyPI wheel
        run: python -m pip install --disable-pip-version-check --no-deps --require-hashes -r .github/requirements-uv.txt
      - name: Install locked project dependencies
        run: uv sync --locked
      - name: Pull and bind the Docker fixture to its immutable digest
        shell: bash
        run: |
          set -euo pipefail
          docker info --format '{{json .SecurityOptions}}'
          docker pull python:3.13-slim
          image_reference="$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.13-slim)"
          if [[ ! "$image_reference" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,254}@sha256:[a-f0-9]{64}$ ]]; then
            echo "Expected a repository digest, got: $image_reference" >&2
            exit 1
          fi
          echo "XAA_DOCKER_IMAGE_DIGEST=$image_reference" >> "$GITHUB_ENV"
          echo "Docker acceptance image: $image_reference"
      - name: Run the real Docker Engine acceptance cases
        shell: bash
        run: |
          set -euo pipefail
          report_dir=".acceptance/docker-live-${GITHUB_RUN_ID}"
          mkdir -p "$report_dir"
          printf '{"image_reference":"%s","docker_server":"%s"}\n' \
            "$XAA_DOCKER_IMAGE_DIGEST" \
            "$(docker version --format '{{.Server.Version}}')" > "$report_dir/environment.json"
          uv run pytest tests/integration/test_docker_local_transport.py -q -rA \
            --junitxml="$report_dir/junit.xml"
        timeout-minutes: 12
      - uses: actions/cache/save@v6
        if: success() && steps.uv-cache.outputs.cache-hit != 'true'
        with:
          path: .uv-cache
          key: ${{ runner.os }}-docker-acceptance-xaa-uv-${{ hashFiles('uv.lock') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-local-acceptance-${{ github.run_id }}
          path: .acceptance/docker-live-${{ github.run_id }}/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
